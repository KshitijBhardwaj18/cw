name: CI/CD

on:
  pull_request:
    branches: [main, master, dev, staging, prod]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install

      - name: Run linting
        run: bun lint

      - name: Generate Prisma client
        run: bun db:generate
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"

      - name: Build packages
        run: bun run package

      - name: Check types
        run: bun typecheck
