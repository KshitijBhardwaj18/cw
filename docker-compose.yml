services:
  redis:
    image: redis:7-alpine
    container_name: workforce-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  workforce:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}
    container_name: workforce
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
    env_file:
      - apps/admin-web/.env
      - apps/org-web/.env
      - apps/server/.env
      - apps/worker/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure:5
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
